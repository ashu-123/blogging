name: Spring Boot Backend CI/CD

on:
  push:
    branches: [ "main" ]
    paths: [ "blog/**" ] # Triggers ONLY when files inside the backend folder change

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./blog # Tells GitHub to run all commands inside the backend folder
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: './blog/pom.xml' # Fixes cache path for monorepos

      - name: Build and Run Tests
        run: mvn clean package

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-app
          path: blog/target/*.jar # Points to the generated JAR file location

  deploy:
    needs: build-and-test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: spring-boot-app
          path: blog/target/

      - name: Copy JAR to AWS EC2 via SSH/SCP
        uses: appleboy/scp-action@master
        with:
          host: "54.91.141.171"
          username: "ubuntu"
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "blog/target/*.jar"
          target: "/home/ubuntu/app/"
          strip_components: 2 # Strips 'backend/target' so only the .jar drops into /app/

      - name: Restart Application on EC2
        uses: appleboy/ssh-action@master
        with:
          host: "54.91.141.171"
          username: "ubuntu"
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Update package managers and ensure Java 21 is installed
            sudo apt-get update -y
            if ! type java > /dev/null 2>&1; then
                echo "Java not found. Installing OpenJDK 21..."
                sudo apt-get install -y openjdk-21-jre-headless
            else
                # Verify it is actually version 21, otherwise upgrade it
                JAVA_VER=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | cut -d'.' -f1)
                if [ "$JAVA_VER" != "21" ]; then
                    echo "Incorrect Java version ($JAVA_VER) found. Upgrading to OpenJDK 21..."
                    sudo apt-get install -y openjdk-21-jre-headless
                fi
            fi

            # 2. Safely stop the existing process
            PID=$(ps aux | grep 'blog-0.0.1-SNAPSHOT.jar' | grep -v grep | awk '{print $2}')
            if [ -n "$PID" ]; then
              echo "Stopping current running backend instance (PID: $PID)..."
              kill -15 $PID
              sleep 5
              # Force kill if it's still hanging
              kill -9 $PID 2>/dev/null || true
            fi
            
            # 3. Clean environment and start the app
            cd /home/ubuntu/app/
            rm -f nohup.out app.log
            
            echo "Starting Spring Boot application..."
            nohup java -jar blog-0.0.1-SNAPSHOT.jar > nohup.out 2>&1 &
            
            # 4. Brief sanity check to ensure it didn't instantly crash
            sleep 3
            if ps -p $! > /dev/null; then
              echo "New Spring Boot version deployed successfully!"
            else
              echo "ERROR: Application crashed immediately upon launch! Checking last 20 lines of logs:"
              cat nohup.out | tail -n 20
              exit 1
            fi
